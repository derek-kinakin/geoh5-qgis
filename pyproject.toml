[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geoh5-qgis"
dynamic = ["version"]
description = "QGIS plugin for browsing and loading objects from geoh5 (GEOSCIENCE ANALYST) files."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["qgis", "plugin", "geoh5", "geoscience", "hdf5", "gdal"]
authors = [
  { name = "Derek Kinakin" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: GIS",
]
# Runtime needs only what QGIS 4.x ships: GDAL (osgeo), numpy and PyQGIS.
# These are deliberately not declared, so nothing gets pip-installed over QGIS's
# own copies. The dev/test environment is environment.yml (mamba env "geoh5-qgis").
dependencies = []

[project.urls]
Source = "https://github.com/derek-kinakin/geoh5-qgis"
Issues = "https://github.com/derek-kinakin/geoh5-qgis/issues"

[tool.hatch.version]
path = "src/geoh5_qgis/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/geoh5_qgis"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source_pkgs = ["geoh5_qgis", "tests"]
branch = true
parallel = true
omit = ["src/geoh5_qgis/__about__.py"]

[tool.coverage.paths]
geoh5_qgis = ["src/geoh5_qgis", "*/geoh5-qgis/src/geoh5_qgis"]
tests = ["tests", "*/geoh5-qgis/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
